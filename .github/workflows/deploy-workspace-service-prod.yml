name: Deploy workspace-service to Production

on:
  push:
    branches:
      - prod

jobs:
  test:
    name: Run Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 with Maven cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Run tests and verify coverage
      - name: Run Tests with Coverage
        run: mvn clean verify

      # 4. Upload JaCoCo coverage report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/jacoco-report/
          retention-days: 30

      # 5. Display coverage summary
      - name: Coverage Summary
        run: |
          echo "=== Code Coverage Report ==="
          if [ -f target/jacoco-report/index.html ]; then
            echo "Coverage report generated successfully"
            echo "Check artifacts for detailed HTML report"
          fi

  deploy:
    name: Build & Deploy workspace-service
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1 Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 Enable multi-arch Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3 Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 4 Build & push workspace-service image (linux/amd64)
      - name: Build & Push workspace-service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/atul-2192/workspace-service:prod

      # 5 SSH into VPS and redeploy workspace-service
      - name: Deploy on Contabo VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/switchboard
            docker compose -f docker-compose.prod.yml pull workspace-service
            docker compose -f docker-compose.prod.yml up -d workspace-service
